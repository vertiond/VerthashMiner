name: Build

# Pull requests are built as a check. A version tag builds and drafts the
# release; push the tag on its own, before the branch, so it gets its own run.
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CUDA_VERSION: '11.8.0'

jobs:
  windows:
    name: Windows (CUDA 11 + OpenCL)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: Jimver/cuda-toolkit@v0.2.35
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      # CUDA 11.8 predates the MSVC shipped with VS 2022 17.10+, so allow it explicitly.
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DCUDA_NVCC_FLAGS="-allow-unsupported-compiler;-D_ALLOW_COMPILER_AND_STL_VERSION_MISMATCH"

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: bash
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || ver="${GITHUB_SHA::7}"
          dir="VerthashMiner-${ver}-CUDA11-windows"
          mkdir -p "dist/$dir"
          cp build/Release/VerthashMiner.exe LICENSE README.md "dist/$dir/"
          cp -r src/kernels "dist/$dir/kernels"
          printf 'VerthashMiner.exe --gen-verthash-data verthash.dat\r\n' > "dist/$dir/generate_verthash_data.bat"
          (cd dist && 7z a "$dir.zip" "$dir" > /dev/null)
          echo "PKG=dist/$dir.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ${{ env.PKG }}

  # Built on Ubuntu 20.04 (glibc 2.31) with curl, jansson, OpenSSL and the C++
  # runtime linked in, so the binary runs on older distros without extra packages.
  linux:
    name: Linux (CUDA 11 + OpenCL)
    runs-on: ubuntu-latest
    container: nvidia/cuda:11.8.0-devel-ubuntu20.04@sha256:03681bbd11fea044ff3e3a5d65e190a6f935af30c56e03e740b27e4563f61e0f
    defaults:
      run:
        shell: bash
    env:
      DEBIAN_FRONTEND: noninteractive
      CURL_VERSION: '8.22.0'
      CURL_SHA256: f7ef3ae8a22e521f289803fe93543eb64c329b58aa73a9e224dfd915a2a5f4f7
    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl xz-utils make cmake g++ libjansson-dev libssl-dev ocl-icd-opencl-dev opencl-headers

      - uses: actions/checkout@v4

      - name: Build static libcurl
        run: |
          curl -fsSLO "https://curl.se/download/curl-${CURL_VERSION}.tar.xz"
          echo "${CURL_SHA256}  curl-${CURL_VERSION}.tar.xz" | sha256sum -c -
          tar xf "curl-${CURL_VERSION}.tar.xz"
          cd "curl-${CURL_VERSION}"
          ./configure --prefix=/opt/curl --disable-shared --enable-static --with-openssl \
            --without-zlib --without-brotli --without-zstd --without-libidn2 --without-libpsl \
            --without-nghttp2 --without-libssh2 --disable-ldap --disable-ldaps --disable-manual --disable-docs
          make -j"$(nproc)" install

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DCURL_INCLUDE_DIR=/opt/curl/include -DCURL_LIBRARY=/opt/curl/lib/libcurl.a -DUSE_CURL_STATIC=ON
          -DJANSSON_LIBRARY=/usr/lib/x86_64-linux-gnu/libjansson.a
          -DOPENSSL_USE_STATIC_LIBS=TRUE
          -DCMAKE_EXE_LINKER_FLAGS="-static-libstdc++ -static-libgcc"
          -DCMAKE_CXX_STANDARD_LIBRARIES="-ldl -lpthread"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: Package
        run: |
          ver="${GITHUB_REF_NAME#v}"
          [[ "$GITHUB_REF_TYPE" == tag ]] || ver="${GITHUB_SHA::7}"
          dir="VerthashMiner-${ver}-CUDA11-linux"
          mkdir -p "dist/$dir"
          cp build/VerthashMiner LICENSE README.md "dist/$dir/"
          cp -r src/kernels "dist/$dir/kernels"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
          echo "PKG=dist/$dir.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ${{ env.PKG }}

  # A version tag creates a draft release with both builds attached, next to
  # the tagged source. Publish it by hand after checking it.
  # Anyone can check a download came from this workflow with:
  #   gh attestation verify <file> --repo <owner>/VerthashMiner
  release:
    if: github.ref_type == 'tag'
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.zip
            dist/*.tar.gz

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "$GITHUB_REF_NAME"
